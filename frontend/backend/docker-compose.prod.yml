version: '3.8'

services:
  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: cvlab_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cvlab_network

  # FastAPI Backend
  backend:
    build: .
    container_name: cvlab_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8002:8000"
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cvlab_network

  # Celery Worker
  celery_worker:
    build: .
    container_name: cvlab_celery
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cvlab_network

volumes:
  redis_data:

networks:
  cvlab_network:
    driver: bridge
