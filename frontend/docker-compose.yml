version: '3.8'

services:
  cvlab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cvlab-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=8001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cvlab-network

networks:
  cvlab-network:
    driver: bridge
