  <line x1="17" y1="7" x2="17" y2="9" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="18" y2="16" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
